# Dedicated Netlify site configuration for the Subscriptions workspace.
#
# In the Netlify project, keep the repository base at `/` and select
# `apps/subscriptions` as the Package directory. This preserves npm workspace
# resolution while isolating this site's build settings from the root app.
[build]
  command = "npm run build:subscriptions"
  publish = "apps/subscriptions/.next"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # Do not inherit the root site's scheduled functions. This site needs only
  # the server handler generated by the Netlify Next.js adapter.
  directory = "apps/subscriptions/netlify/functions"
