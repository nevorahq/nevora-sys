name: nevora-tasks-staging

services:
  tasks:
    image: ${TASKS_IMAGE:?Set TASKS_IMAGE to an immutable sha tag}
    pull_policy: always
    init: true
    restart: unless-stopped
    ports:
      - "${TASKS_BIND_ADDRESS:-127.0.0.1}:${TASKS_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3001
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY}
      TASKS_SERVICE_AUTH_SECRET: ${TASKS_SERVICE_AUTH_SECRET:?Set TASKS_SERVICE_AUTH_SECRET}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: ${TASKS_MEMORY_LIMIT:-512m}
    cpus: ${TASKS_CPU_LIMIT:-0.50}
    stop_grace_period: 15s
